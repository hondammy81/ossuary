<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadline Crypt</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* -------------------------------------------------------
       Deadline Crypt — app-level overrides
       The skeleton theme.css handles all tokens and components.
       ------------------------------------------------------- */

    /* Single-column scroll layout — no sidebar needed */
    .app-body {
      display: block;
      height: auto;
      overflow: visible;
    }

    .app-main {
      max-width: 680px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-6);
    }

    /* Add-form card */
    .add-card {
      margin-bottom: var(--space-8);
    }

    .add-card h2 {
      margin-bottom: var(--space-5);
      font-size: var(--text-lg);
    }

    /* Bucket section */
    .bucket-section {
      margin-bottom: var(--space-8);
    }

    .bucket-section__heading {
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-dim);
      margin-bottom: var(--space-3);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--color-border);
    }

    .bucket-section__heading--dying  { color: var(--color-ember); }
    .bucket-section__heading--alive  { color: var(--color-ok);    }
    .bucket-section__heading--dead   { color: var(--color-danger); }

    /* Deadline card */
    .deadline-card {
      display: flex;
      align-items: flex-start;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-5);
      margin-bottom: var(--space-3);
    }

    .deadline-card__body {
      flex: 1;
      min-width: 0;
    }

    .deadline-card__title {
      font-size: var(--text-base);
      font-weight: 500;
      color: var(--color-bone);
    }

    .deadline-card__meta {
      font-size: var(--text-sm);
      color: var(--color-muted);
      margin-top: var(--space-1);
    }

    .deadline-card__category {
      font-size: var(--text-xs);
      color: var(--color-dim);
      margin-top: var(--space-1);
    }

    .deadline-card__actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-shrink: 0;
    }

    /* Resurrect inline row */
    .resurrect-row {
      display: flex;
      gap: var(--space-2);
      align-items: center;
      margin-top: var(--space-3);
      flex-wrap: wrap;
    }

    .resurrect-row .input {
      width: auto;
      flex: 1;
      min-width: 120px;
    }

    /* Export / import section */
    .export-section {
      margin-top: var(--space-10);
      padding-top: var(--space-6);
      border-top: 1px solid var(--color-border);
    }

    .export-section h3 {
      margin-bottom: var(--space-4);
    }

    .export-section__row {
      display: flex;
      gap: var(--space-3);
      align-items: center;
      flex-wrap: wrap;
    }

    .import-error {
      font-size: var(--text-xs);
      color: var(--color-danger);
      margin-top: var(--space-2);
    }

    .import-ok {
      font-size: var(--text-xs);
      color: var(--color-ok);
      margin-top: var(--space-2);
    }

    @media (max-width: 640px) {
      .app-main {
        padding: var(--space-5) var(--space-4);
      }

      .deadline-card {
        flex-direction: column;
        gap: var(--space-3);
      }

      .deadline-card__actions {
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
